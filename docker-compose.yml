services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - JWT_SECRET=change-me-in-production
      - DATABASE_URL=sqlite:////data/platform.db
    volumes:
      - platform-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  platform-data:
