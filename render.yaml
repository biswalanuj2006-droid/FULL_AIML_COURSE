services:
  - type: web
    name: aiml-academy
    runtime: python
    plan: free
    buildCommand: "pip install -r platform/backend/requirements.txt && cd platform/frontend && npm install && npm run build && cd ../.. && python build.sh.py"
    startCommand: "cd platform/backend && python seed_run.py && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: NODE_VERSION
        value: "20"
    disk:
      name: platform-data
      mountPath: /data
      sizeGB: 1
