[build]
  builder = "NIXPACKS"
  buildCommand = "cd platform/frontend && npm install && npm run build"

[deploy]
  startCommand = "cd platform/backend && python seed_run.py && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
  healthcheckPath = "/api/health"
  healthcheckTimeout = 120
  restartPolicyType = "ON_FAILURE"
